<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demolition Notice</title>
<meta name="description" content="Every building the City of Minneapolis has okayed for demolition, on one map. Address, who is tearing it down, year built, and the county record. For scrappers and junk haulers.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#151515; --mute:#5e5e5e; --line:#dedad2; --paper:#f8f6f1; --accent:#c2410c; --year:#f59e0b; --old:#8a8178; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink);
    font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { flex:none; display:flex; align-items:center; gap:.5rem; padding:.5rem .75rem; padding-top:max(.5rem, env(safe-area-inset-top));
    background:var(--paper); border-bottom:1px solid var(--line); z-index:2; }
  .brand { font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:.8rem; display:flex; align-items:center; gap:.4rem; white-space:nowrap; }
  .brand i { width:.7rem; height:.7rem; background:var(--accent); display:inline-block; border-radius:2px; }
  .chips { margin-left:auto; display:flex; gap:.3rem; }
  .chips button { font:inherit; font-size:.78rem; font-weight:600; border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:999px; padding:.35rem .6rem; min-height:34px; cursor:pointer; display:flex; align-items:center; gap:.3rem; white-space:nowrap; }
  .chips button[aria-pressed=true] { background:var(--ink); color:#fff; border-color:var(--ink); }
  @media (max-width:400px) { .chips button { padding:.35rem .5rem; gap:.25rem; } .chips { gap:.25rem; } .brand { font-size:.74rem; } header { gap:.35rem; padding-left:.6rem; padding-right:.6rem; } }
  .dot { width:.55rem; height:.55rem; border-radius:50%; display:inline-block; }
  #map { flex:1; min-height:0; }
  footer { flex:none; font-size:.75rem; color:var(--mute); padding:.35rem .75rem; padding-bottom:max(.35rem, env(safe-area-inset-bottom));
    background:var(--paper); border-top:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:500; background:#fff; padding:.6rem .9rem;
    border-radius:8px; border:1px solid var(--line); font-weight:600; }
  #status:empty { display:none; }
  .leaflet-popup-content { margin:.75rem .85rem; font-size:14px; line-height:1.4; }
  .leaflet-popup-content-wrapper { border-radius:10px; }
  .leaflet-popup-content a.p-addr { color:var(--ink); }
  .p-addr { font-weight:700; font-size:1.05rem; display:block; color:var(--ink); text-decoration:none; }
  .p-addr::after { content:" ↗"; color:var(--mute); font-weight:400; }
  .p-when { font-weight:600; margin:.15rem 0 .35rem; }
  .p-when .new { color:var(--accent); }
  .p-line { margin:.1rem 0; }
  .p-what { margin:.3rem 0; font-style:italic; }
  .p-guess { color:var(--mute); font-size:.82rem; }
  .p-warn { margin:.45rem 0 .2rem; color:var(--mute); font-size:.85rem; }
  details { margin-top:.35rem; border-top:1px solid var(--line); padding-top:.35rem; }
  summary { cursor:pointer; font-weight:600; font-size:.88rem; min-height:28px; display:flex; align-items:center; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:.15rem .6rem; margin:.3rem 0 0; font-size:.85rem; }
  dt { color:var(--mute); } dd { margin:0; }
  /* phones: the record opens in a bottom sheet, not a 290px popup the map has to pan around */
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:1000; max-height:58dvh; overflow-y:auto; overscroll-behavior:contain;
    background:#fff; border-radius:14px 14px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18); padding:.4rem 1rem max(1rem, env(safe-area-inset-bottom)); font-size:15px; }
  #sheet .grab { position:sticky; top:0; display:flex; justify-content:center; padding:.2rem 0 .1rem; background:#fff; }
  #sheet .grab::before { content:""; width:2.5rem; height:4px; border-radius:2px; background:var(--line); }
  #sheet .x { position:absolute; top:.2rem; right:.3rem; width:44px; height:44px; border:0; background:none; font-size:1.5rem; line-height:1; color:var(--mute); cursor:pointer; }
  #sheet .p-addr { padding-right:2.4rem; font-size:1.15rem; }
  #sheet summary { min-height:44px; }
  .locate { width:44px; height:44px; border:0; background:#fff; font-size:1.3rem; line-height:1; cursor:pointer; color:var(--ink); }
  .leaflet-control-attribution { white-space:nowrap; max-width:100vw; overflow:hidden; text-overflow:ellipsis; }
  @media (pointer:coarse) { .leaflet-control-zoom { display:none; } }
  dl h4 { grid-column:1 / -1; margin:.4rem 0 0; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i> Demolition Notice</div>
  <div class="chips" role="group" aria-label="How recent">
    <button data-days="30" aria-pressed="false"><span class="dot" style="background:var(--accent)"></span><span id="n30">30 days</span></button>
    <button data-days="365" aria-pressed="false"><span class="dot" style="background:var(--year)"></span><span id="n365">1 yr</span></button>
    <button data-days="0" aria-pressed="true"><span class="dot" style="background:var(--old)"></span><span id="nall">All</span></button>
  </div>
</header>
<div id="map"><div id="status">Loading every teardown…</div></div>
<aside id="sheet" hidden aria-label="Teardown details"><div class="grab"></div><button class="x" aria-label="Close">×</button><div id="sheet-body"></div></aside>
<footer>Drive by first. Ask the owner or crew before you take anything.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const cat = (c) => String(c).replace(/_/g, " ");
  const money = (n) => "$" + Number(n).toLocaleString("en-US");
  const DAY = 864e5;
  const ageDays = (iso) => { const [y, m, d] = iso.split("-").map(Number); return Math.floor((Date.now() - Date.UTC(y, m - 1, d)) / DAY); };
  const fmt = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d || 1, 12)).toLocaleDateString("en-US", { month: "short", ...(d ? { day: "numeric" } : {}), year: "numeric", timeZone: "UTC" }); };
  const ago = (n) => n <= 0 ? "today" : n === 1 ? "yesterday" : n < 60 ? `${n} days ago` : n < 730 ? `${Math.round(n / 30.4)} months ago` : `${Math.floor(n / 365)} years ago`;

  const coarse = matchMedia("(pointer:coarse)").matches;
  const phone = () => matchMedia("(max-width:600px)").matches;
  // a fingertip is ~40px; widen the canvas hit area so the 4.5px grey dots can be tapped
  const map = L.map("map", { zoomControl: false, renderer: L.canvas({ tolerance: coarse ? 9 : 2 }), maxZoom: 16, attributionControl: false }).setView([44.97, -93.265], 12);
  L.control.attribution({ prefix: false }).addTo(map);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  // "near me": the visitor is usually in a truck, deciding which way to drive
  const Locate = L.Control.extend({ options: { position: "bottomright" }, onAdd() {
    const b = L.DomUtil.create("button", "locate leaflet-bar");
    b.title = "Show teardowns near me"; b.setAttribute("aria-label", b.title); b.textContent = "◎";
    L.DomEvent.disableClickPropagation(b);
    b.onclick = () => map.locate({ setView: true, maxZoom: 15 });
    return b;
  } });
  new Locate().addTo(map);
  let me;
  map.on("locationfound", (e) => { (me ||= L.circleMarker(e.latlng, { radius: 7, fillColor: "#2563eb", fillOpacity: 1, color: "#fff", weight: 3, interactive: false }).addTo(map)).setLatLng(e.latlng); });
  map.on("locationerror", () => { $("status").textContent = "Couldn't find you. Allow location and try again."; setTimeout(() => ($("status").textContent = ""), 3000); });
  // Esri's keyless light-gray canvas; Carto's light_all started answering "API KEY REQUIRED" (2026-10-06)
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 16, attribution: "Esri, HERE, OSM · Minneapolis · Hennepin Co. · Overture",
  }).addTo(map);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16 }).addTo(map);

  function popup(r) {
    const n = ageDays(r.issued), p = r.parcel || {};
    const age = p.built ? ` · built ${p.built}` : "";
    const head = [
      `<a class="p-addr" href="${esc(r.map)}" target="_blank" rel="noopener">${esc(r.address)}</a>`,
      `<div class="p-when"><span class="${n <= 30 ? "new" : ""}">${esc(r.label)} · okayed ${ago(n)}</span>${age}</div>`,
      `<div class="p-line">Tearing it down: <b>${esc(r.wrecker || "not listed")}</b></div>`,
      r.completed ? `<div class="p-line">City closed the permit ${fmt(r.completed)}</div>` : `<div class="p-line">Permit still open${r.stage && r.stage !== r.status ? ` (${esc(r.stage.toLowerCase())})` : ""}</div>`,
      p.rebuilt ? `<div class="p-line">Already rebuilt: the county shows a building from ${p.rebuilt}</div>` : "",
      r.what ? `<div class="p-what">${esc(r.what)}</div>` : "",
      (r.was || []).length ? `<div class="p-line">Was: ${r.was.map((w) => `<b>${esc(w.name)}</b>${w.category ? ` (${esc(cat(w.category))})` : ""}`).join(", ")}</div>` : "",
      r.inside ? `<div class="p-line">Likely inside: ${esc(r.inside.items.join(", "))} <span class="p-guess">(a guess for ${esc(r.inside.basis)})</span></div>` : "",
      `<div class="p-warn">Drive by first. Ask the owner or crew before you take anything.</div>`,
    ];
    const row = (k, v) => (v || v === 0) ? `<dt>${k}</dt><dd>${v}</dd>` : "";
    const rec = [
      "<h4>City permit</h4>",
      row("Permit", esc(r.permit_no)), row("Issued", fmt(r.issued)), row("Status", esc([r.status, r.stage !== r.status ? r.stage : ""].filter(Boolean).join(", "))),
      row("Closed", fmt(r.completed)), row("Job value", r.value && money(r.value)), row("Permit fees", r.fees && money(Math.round(r.fees))),
      row("Units removed", r.units_gone), row("Neighborhood", esc(r.hood)), row("Ward", esc(r.ward)),
    ];
    if (r.parcel) rec.push(
      "<h4>County parcel today</h4>",
      row("Use", esc(p.use)), row("Built", p.built || (p.rebuilt ? `${p.rebuilt} (new building)` : "")),
      row("Market value", p.value && money(p.value)), row("Land", p.land && money(p.land)), row("Building", p.bldg && money(p.bldg)),
      row("Lot", p.lot_sqft && `${p.lot_sqft.toLocaleString("en-US")} sq ft`),
      row("Last sale", p.sold && `${money(p.sold.price)}, ${fmt(p.sold.month)}`),
    );
    return head.join("") + `<details><summary>Everything we know</summary><dl>${rec.join("")}</dl></details>`;
  }

  let rows = [];
  try {
    const r = await fetch("/api/scrapwatch?map=3");
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    rows = d.rows.filter((x) => x.lat && x.lon);
    $("n30").textContent = `${d.totals.last_30} · 30d`;
    $("n365").textContent = `${d.totals.last_365} · 1yr`;
    $("nall").textContent = `${d.totals.rows} · all`;
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = "The map didn't load. Try again in a minute.";
    return;
  }

  // oldest first, so the newest draw on top
  const marks = rows.slice().reverse().map((r) => {
    const n = ageDays(r.issued);
    const style = n <= 30 ? { radius: 9, fillColor: "#c2410c", fillOpacity: .95, color: "#fff", weight: 2 }
      : n <= 365 ? { radius: 6.5, fillColor: "#f59e0b", fillOpacity: .9, color: "#fff", weight: 1.5 }
      : { radius: 4.5, fillColor: "#8a8178", fillOpacity: .45, color: "#8a8178", weight: .5, opacity: .6 };
    const m = L.circleMarker([r.lat, r.lon], style).on("click", (e) => { L.DomEvent.stopPropagation(e); open(r, m); });
    return { m, n, r };
  });

  const sheet = $("sheet"), ring = L.circleMarker([0, 0], { radius: 13, fill: false, color: "#151515", weight: 3, interactive: false });
  function open(r, m) {
    if (!phone()) {
      closeSheet();
      L.popup({ maxWidth: 290, maxHeight: Math.max(260, $("map").clientHeight - 70), autoPanPadding: [10, 10] })
        .setLatLng(m.getLatLng()).setContent(r.el ||= Object.assign(document.createElement("div"), { innerHTML: popup(r) })).openOn(map);
      return;
    }
    map.closePopup();
    $("sheet-body").innerHTML = popup(r);
    sheet.hidden = false; sheet.scrollTop = 0;
    ring.setLatLng(m.getLatLng()).addTo(map);
    // keep the tapped pin in the strip of map the sheet leaves showing
    const box = $("map").getBoundingClientRect(), pt = map.latLngToContainerPoint(m.getLatLng());
    const visible = Math.max(80, sheet.getBoundingClientRect().top - box.top);
    map.panBy([pt.x - box.width / 2, pt.y - visible / 2]);
  }
  function closeSheet() { if (sheet.hidden) return; sheet.hidden = true; ring.remove(); }
  sheet.querySelector(".x").addEventListener("click", closeSheet);
  map.on("click", closeSheet);
  addEventListener("keydown", (e) => e.key === "Escape" && closeSheet());
  // opening "Everything we know" grows the popup; re-lay it out so it pans back into view
  map.on("popupopen", (e) => {
    const d = e.popup.getElement().querySelector("details");
    if (d) d.addEventListener("toggle", () => e.popup.update());
  });
  const layer = L.layerGroup().addTo(map);
  function show(days) {
    layer.clearLayers();
    for (const { m, n } of marks) if (!days || n <= days) layer.addLayer(m);
    document.querySelectorAll(".chips button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === days)));
  }
  document.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => show(Number(b.dataset.days))));
  show(0);
  // ?p=<permit number> opens that pin, so a message can point at one building
  const want = new URLSearchParams(location.search).get("p");
  const hit = want && marks.find((x) => x.r.permit_no === want.toUpperCase());
  // fitBounds animates, and its zoom would land after (and undo) the jump to the pin
  if (hit) { map.setView(hit.m.getLatLng(), 16, { animate: false }); open(hit.r, hit.m); }
  else map.fitBounds(L.latLngBounds(rows.map((r) => [r.lat, r.lon])), { padding: [8, 8] });
})();
</script>
</body>
</html>
